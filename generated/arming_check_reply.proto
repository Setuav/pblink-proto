
syntax = "proto3";

import "nanopb.proto";

package px4_pblink.msgs;

message ArmingCheckReply {
uint64 timestamp = 1;
uint32 request_id = 2;
uint32 registration_id = 3;
uint32 health_component_index = 4;
bool health_component_is_present = 5;
bool health_component_warning = 6;
bool health_component_error = 7;
bool can_arm_and_run = 8;
uint32 num_events = 9;
bool mode_req_angular_velocity = 10;
bool mode_req_attitude = 11;
bool mode_req_local_alt = 12;
bool mode_req_local_position = 13;
bool mode_req_local_position_relaxed = 14;
bool mode_req_global_position = 15;
bool mode_req_global_position_relaxed = 16;
bool mode_req_mission = 17;
bool mode_req_home_position = 18;
bool mode_req_prevent_arming = 19;
bool mode_req_manual_control = 20;

}