
syntax = "proto3";

import "nanopb.proto";

package px4_pblink.msgs;

message OnboardComputerStatus {
uint64 timestamp = 1;
uint32 uptime = 2;
uint32 type = 3;
repeated uint32 cpu_cores = 4 [(nanopb).max_count = 8, (nanopb).fixed_count = true];
repeated uint32 cpu_combined = 5 [(nanopb).max_count = 10, (nanopb).fixed_count = true];
repeated uint32 gpu_cores = 6 [(nanopb).max_count = 4, (nanopb).fixed_count = true];
repeated uint32 gpu_combined = 7 [(nanopb).max_count = 10, (nanopb).fixed_count = true];
int32 temperature_board = 8;
repeated int32 temperature_core = 9 [(nanopb).max_count = 8, (nanopb).fixed_count = true];
repeated int32 fan_speed = 10 [(nanopb).max_count = 4, (nanopb).fixed_count = true];
uint32 ram_usage = 11;
uint32 ram_total = 12;
repeated uint32 storage_type = 13 [(nanopb).max_count = 4, (nanopb).fixed_count = true];
repeated uint32 storage_usage = 14 [(nanopb).max_count = 4, (nanopb).fixed_count = true];
repeated uint32 storage_total = 15 [(nanopb).max_count = 4, (nanopb).fixed_count = true];
repeated uint32 link_type = 16 [(nanopb).max_count = 6, (nanopb).fixed_count = true];
repeated uint32 link_tx_rate = 17 [(nanopb).max_count = 6, (nanopb).fixed_count = true];
repeated uint32 link_rx_rate = 18 [(nanopb).max_count = 6, (nanopb).fixed_count = true];
repeated uint32 link_tx_max = 19 [(nanopb).max_count = 6, (nanopb).fixed_count = true];
repeated uint32 link_rx_max = 20 [(nanopb).max_count = 6, (nanopb).fixed_count = true];

}