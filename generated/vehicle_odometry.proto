
syntax = "proto3";

import "nanopb.proto";

package px4_pblink.msgs;

message VehicleOdometry {
uint64 timestamp = 1;
uint64 timestamp_sample = 2;
uint32 pose_frame = 3;
repeated float position = 4 [(nanopb).max_count = 3, (nanopb).fixed_count = true];
repeated float q = 5 [(nanopb).max_count = 4, (nanopb).fixed_count = true];
uint32 velocity_frame = 6;
repeated float velocity = 7 [(nanopb).max_count = 3, (nanopb).fixed_count = true];
repeated float angular_velocity = 8 [(nanopb).max_count = 3, (nanopb).fixed_count = true];
repeated float position_variance = 9 [(nanopb).max_count = 3, (nanopb).fixed_count = true];
repeated float orientation_variance = 10 [(nanopb).max_count = 3, (nanopb).fixed_count = true];
repeated float velocity_variance = 11 [(nanopb).max_count = 3, (nanopb).fixed_count = true];
uint32 reset_counter = 12;
int32 quality = 13;

}